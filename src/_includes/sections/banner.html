<!--                   Banner                     -->
<!-- ============================================ -->

<div id="banner-2285">
    <div class="cs-container">
        <span class="cs-int-title">{{ bannerTitle }}</span>
        <div class="cs-breadcrumbs">
            <a href="/" class="cs-link">Home</a>
            {% if parentUrl %}<a href="{{ parentUrl }}" class="cs-link">{{ parentTitle }}</a>{% endif %}
            <a href="{{ page.url }}" class="cs-link cs-active" aria-current="page">{{ crumb or bannerTitle }}</a>
        </div>
    </div>
    <picture class="cs-background">
        <!--Mobile Image-->
        <source media="(max-width: 600px)" srcset="{% getUrl bannerImage | resize({ width: 608, height: 734, position: "attention" }) | avif %}" type="image/avif">
        <!--Tablet Image-->
        <source media="(max-width: 1024px)" srcset="{% getUrl bannerImage | resize({ width: 1980, height: 820, position: "attention" }) | avif %}" type="image/avif">
        <!--Desktop Image-->
        <source media="(min-width: 1024px)" srcset="{% getUrl bannerImage | resize({ width: 2500, height: 647, position: "attention" }) | avif %}" type="image/avif">
        <img src="{% getUrl bannerImage | resize({ width: 2500, height: 647, position: "attention" }) | jpeg %}" alt="{{ bannerAlt }}" width="1800" height="465" loading="eager" decoding="async">
    </picture>
</div>
