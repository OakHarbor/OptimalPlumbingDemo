<!-- ============================================ -->
<!--                   Banner                     -->
<!-- ============================================ -->

<div id="banner-2285">
    <div class="cs-container">
        <span class="cs-int-title">{{ bannerTitle }}</span>
        <div class="cs-breadcrumbs">
            <a href="/" class="cs-link">Home</a>
            {% if parentUrl %}<a href="{{ parentUrl }}" class="cs-link">{{ parentTitle }}</a>{% endif %}
            <a href="{{ page.url }}" class="cs-link cs-active" aria-current="page">{{ crumb or bannerTitle }}</a>
        </div>
    </div>
    <picture class="cs-background">
        <source media="(max-width: 600px)" srcset="{% getUrl bannerImage | resize({ width: 640, height: 600 }) | avif %}" type="image/avif">
        <source media="(max-width: 600px)" srcset="{% getUrl bannerImage | resize({ width: 640, height: 600 }) | webp %}" type="image/webp">
        <source media="(max-width: 600px)" srcset="{% getUrl bannerImage | resize({ width: 640, height: 600 }) | jpeg %}" type="image/jpeg">
        <source media="(max-width: 1024px)" srcset="{% getUrl bannerImage | resize({ width: 1600, height: 800 }) | avif %}" type="image/avif">
        <source media="(max-width: 1024px)" srcset="{% getUrl bannerImage | resize({ width: 1600, height: 800 }) | webp %}" type="image/webp">
        <source media="(max-width: 1024px)" srcset="{% getUrl bannerImage | resize({ width: 1600, height: 800 }) | jpeg %}" type="image/jpeg">
        <source media="(min-width: 1025px)" srcset="{% getUrl bannerImage | resize({ width: 1800, height: 465 }) | avif %}" type="image/avif">
        <source media="(min-width: 1025px)" srcset="{% getUrl bannerImage | resize({ width: 1800, height: 465 }) | webp %}" type="image/webp">
        <source media="(min-width: 1025px)" srcset="{% getUrl bannerImage | resize({ width: 1800, height: 465 }) | jpeg %}" type="image/jpeg">
        <img src="{% getUrl bannerImage | resize({ width: 1800, height: 465 }) | jpeg %}" alt="{{ bannerAlt }}" width="1800" height="465" loading="eager" decoding="async">
    </picture>
</div>
