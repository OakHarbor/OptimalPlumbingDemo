{% set faqItems = faq.slice(0, faqLimit) if faqLimit else faq %}
<section id="faq-1741">
    <div class="cs-container">
        <div class="cs-content">
            <span class="cs-topper">Questions</span>
            <{{ faqHeading or "h2" }} class="cs-title">Answers Before You Call</{{ faqHeading or "h2" }}>
        </div>
        <div class="cs-flex-group">
            <ul class="cs-faq-group">
                {% for item in faqItems %}
                <li class="cs-faq-item{% if loop.first %} active{% endif %}" id="{{ item.id }}">
                    <h3 class="cs-question">
                        <button class="cs-button" type="button" aria-expanded="{{ "true" if loop.first else "false" }}" aria-controls="{{ item.id }}-answer" id="{{ item.id }}-button">
                            <span class="cs-icon" aria-hidden="true"></span>
                            <span class="cs-button-text">{{ item.question }}</span>
                        </button>
                    </h3>
                    <div class="cs-answer" id="{{ item.id }}-answer" role="region" aria-labelledby="{{ item.id }}-button">
                        <div class="cs-answer-inner">
                            <p class="cs-item-text">{{ item.answer | safe }}</p>
                        </div>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
    <div class="cs-gallery">
        <picture class="cs-picture">
